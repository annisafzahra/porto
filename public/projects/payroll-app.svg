    <!-- Screen Notch -->
    <rect x="65" y="10" width="80" height="14" rx="7" fill="#ece4d8" />
    <!-- Overtime Calculator Card -->
    <rect x="20" y="45" width="170" height="85" rx="12" fill="#f8f5ef" />
