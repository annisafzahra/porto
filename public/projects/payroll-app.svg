    <text x="32" y="90" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#191919">4.5 Jam Kerja</text>
    <text x="32" y="112" font-family="'Poppins', sans-serif" font-size="9" font-weight="500" fill="#546e63">✓ Validasi Shift Disetujui</text>

    <!-- Reimburse Form Preview -->
    <rect x="20" y="145" width="170" height="150" rx="12" fill="#ffffff" stroke="#eee6dc" />
