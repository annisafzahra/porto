    <rect x="32" y="185" width="146" height="30" rx="6" fill="#faf8f5" stroke="#ded5c5" />
    <text x="42" y="204" font-family="'Poppins', sans-serif" font-size="9" fill="#858077">Rp 450.000 (Transport)</text>
    <rect x="32" y="225" width="146" height="30" rx="6" fill="#faf8f5" stroke="#ded5c5" />
    <text x="42" y="244" font-family="'Poppins', sans-serif" font-size="9" fill="#546e63">📎 Struk-Fisik-Verified.jpg</text>
    <rect x="32" y="265" width="146" height="22" rx="11" fill="#546e63" />
    <text x="105" y="279" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff">STATUS: APPROVED</text>
  </g>

  <!-- Mobile Screen 2 / Side-by-side -->
  <g transform="translate(420, 50)" filter="url(#cardShadow)">
    <rect width="210" height="400" rx="28" fill="#ffffff" stroke="#ded5c5" stroke-width="2" />
    <rect x="65" y="10" width="80" height="14" rx="7" fill="#ece4d8" />

    <text x="32" y="55" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#191919">Slip Gaji & Verifikasi</text>
    <rect x="20" y="70" width="170" height="90" rx="12" fill="#faf8f5" stroke="#eee6dc" />
    <text x="32" y="92" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#858077">Gaji Pokok + Lembur</text>
    <text x="32" y="115" font-family="'Poppins', sans-serif" font-size="15" font-weight="800" fill="#546e63">Rp 5.850.000</text>
    <text x="32" y="140" font-family="'Poppins', sans-serif" font-size="9" fill="#8c735d">Postman Test: Payload Valid</text>

    <!-- QA Checklist -->
    <rect x="20" y="175" width="170" height="180" rx="12" fill="#f8f5ef" />
    <text x="32" y="198" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#8c735d">QA HIGHLIGHTS</text>
    <text x="32" y="224" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#191919">✓ Postman API Collections</text>
    <text x="32" y="246" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#191919">✓ Boundary Nominal Check</text>
    <text x="32" y="268" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#191919">✓ Edge-Case Shift Malam</text>
    <text x="32" y="290" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#191919">✓ File Upload Size Guard</text>
    <rect x="32" y="315" width="146" height="26" rx="13" fill="#8c735d" />
    <text x="105" y="331" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff">CV. INDOKODING</text>
