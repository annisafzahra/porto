  <rect width="800" height="500" rx="16" fill="url(#bgPerpus)" />

  <rect x="70" y="55" width="660" height="390" rx="18" fill="#ffffff" stroke="#ded5c5" stroke-width="1.5" filter="url(#cardShadow)" />

