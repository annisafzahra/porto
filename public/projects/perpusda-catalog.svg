    <rect x="82" y="70" width="80" height="22" rx="11" fill="#546e63" />
    <text x="122" y="85" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffffff">TERSEDIA</text>
    <text x="15" y="125" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#8c735d">✓ Alur Reservasi Tiket Terverifikasi</text>
